version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-dev:
        patterns: ['pytest*', 'ruff', 'black', 'mypy', 'httpx']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-dev:
        patterns: ['@types/*', 'eslint*', 'prettier', 'vitest', '@vitest/*', '@testing-library/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
