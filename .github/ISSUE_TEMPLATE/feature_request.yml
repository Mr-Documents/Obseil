name: Feature request
description: Suggest a capability for Obseil.
labels: ['enhancement', 'needs triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the solution you have in mind.
      placeholder: When I upload a monthly export, I cannot tell which columns regressed since last month.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of contribution is this?
      options:
        - New quality detector
        - New anomaly detection algorithm
        - New file format
        - New visualisation
        - New report format
        - API change
        - UI/UX improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: contribute
    attributes:
      label: Are you willing to implement it?
      options:
        - label: I would like to work on this myself
