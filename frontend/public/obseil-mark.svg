<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Obseil">
  <!--
    The Obseil mark: a Q built from a lens ring, with a rising bar chart inside.
    Drawn rather than exported so it stays crisp from a 16px favicon upwards.

    Kept byte-for-byte in step with `ObseilMark` in src/components/brand/Logo.tsx.
    A favicon has to be a file and the app wants inline SVG, so the artwork
    genuinely lives in two places; change both together.
  -->
  <defs>
    <linearGradient id="obseil-ring" x1="10" y1="52" x2="54" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CF0" />
      <stop offset="0.45" stop-color="#4C7DF0" />
      <stop offset="1" stop-color="#3ECF8E" />
    </linearGradient>
    <linearGradient id="obseil-bars" x1="22" y1="42" x2="42" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35C7A5" />
      <stop offset="1" stop-color="#4ADE9B" />
    </linearGradient>
    <linearGradient id="obseil-spark" x1="46" y1="20" x2="56" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6AA8F5" />
      <stop offset="1" stop-color="#4ADE9B" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#1C2035" />

  <!-- The Q: ring plus tail. -->
  <circle cx="29" cy="30" r="15.5" stroke="url(#obseil-ring)" stroke-width="6" />
  <path
    d="M37.5 41.5 L46 50"
    stroke="url(#obseil-ring)"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Three rising bars, the reason the ring is worth looking through. -->
  <g fill="url(#obseil-bars)">
    <rect x="21.5" y="31" width="4.5" height="8" rx="1.2" />
    <rect x="28" y="27" width="4.5" height="12" rx="1.2" />
    <rect x="34.5" y="22.5" width="4.5" height="16.5" rx="1.2" />
  </g>

  <!-- Sparkles: the "intelligence" half of the name. -->
  <path
    d="M51 12 C51 15 52.5 16.5 55.5 16.5 C52.5 16.5 51 18 51 21 C51 18 49.5 16.5 46.5 16.5 C49.5 16.5 51 15 51 12 Z"
    fill="url(#obseil-spark)"
  />
  <path
    d="M52 46 C52 48 53 49 55 49 C53 49 52 50 52 52 C52 50 51 49 49 49 C51 49 52 48 52 46 Z"
    fill="#8B93A3"
    fill-opacity="0.75"
  />
  <path
    d="M57.5 54 C57.5 55.3 58.2 56 59.5 56 C58.2 56 57.5 56.7 57.5 58 C57.5 56.7 56.8 56 55.5 56 C56.8 56 57.5 55.3 57.5 54 Z"
    fill="#8B93A3"
    fill-opacity="0.55"
  />
</svg>
